name: Notify Telegram - Shipbuilding

on:
  push:
    branches: [ main ]
    paths:
      - 'shipbuilding/daily/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Send latest daily file to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'shipbuilding/daily/*.md' | tail -n1)
          if [ -z "$FILE" ]; then
            echo "No daily file changed, skipping"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@"$FILE"
